services:
  - type: web
    name: tritech-hub
    env: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: SIMPLEMDM_API_KEY
        sync: false
      # The relay for staff meetings, used when two phones cannot reach
      # each other directly — the normal case when one person is on wifi
      # and another on mobile data, because a carrier puts thousands of
      # customers behind one address and there is no route in.
      #
      # Cloudflare's TURN service is the one to use: credentials are
      # minted per meeting and expire, so nothing long-lived is stored
      # here. Create a TURN key in the Cloudflare dashboard and set these
      # two. Their free allowance is far beyond what a shop can use — a
      # voice call is about 13 MB an hour per person.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Or a relay of the shop's own (a self-hosted coturn). Used only
      # when the Cloudflare pair above is not set.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
      # How many cameras one meeting carries at once. Voice is the point;
      # every camera is another video stream every other phone must send
      # and receive. Defaults to 3.
      - key: MEETING_CAMERA_LIMIT
        sync: false
      # Web push. Generate once with `npm run vapid` in backend/.
      # Listed here so a blueprint sync cannot quietly drop them.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        value: Lawrencesarpong2003@gmail.com
      - key: UPLOAD_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 5242880
